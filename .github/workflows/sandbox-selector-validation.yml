name: Sandbox complete car selector
on:
  push:
    branches: [fix/sandbox-all-cars-selector]

jobs:
  sandbox-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Validate all stock and prepared choices
        run: npx playwright test tests/e2e/sandbox-campaign-cars.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-all-cars-selector-evidence
          path: test-results/
          if-no-files-found: ignore
