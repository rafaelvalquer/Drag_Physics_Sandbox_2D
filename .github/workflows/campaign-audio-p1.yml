name: P1 Brazilian cars and audio
on:
  push:
    branches: [feature/p1-brazilian-cars-sandbox-audio]
  pull_request:
    branches: [main]
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  sandbox-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/sandbox-campaign-cars.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-brazilian-browser-evidence
          path: test-results/
          if-no-files-found: ignore
